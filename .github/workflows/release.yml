name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run on main branch pushes, skip automated release commits
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release version --no-commit --no-tag --no-push --no-changelog
          # Prints the version that was bumped (if any)

      - name: Check if version changed
        id: version_check
        run: |
          if git diff --quiet HEAD; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Update uv.lock for release
        if: steps.version_check.outputs.changed == 'true'
        run: |
          uv lock

      - name: Compute release metadata
        if: steps.version_check.outputs.changed == 'true'
        id: release_meta
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          TAG="v${VERSION}"
          COMMIT_MESSAGE="chore(release): ${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${COMMIT_MESSAGE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token (optional)
        if: steps.version_check.outputs.changed == 'true' && vars.APP_CLIENT_ID != ''
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve release token
        if: steps.version_check.outputs.changed == 'true'
        id: release_token
        run: |
          if [ -n "${{ steps.app_token.outputs.token }}" ]; then
            TOKEN="${{ steps.app_token.outputs.token }}"
            echo "Using GitHub App token for release commit"
          else
            TOKEN="${{ github.token }}"
            echo "Using default github.token for release commit"
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        if: steps.version_check.outputs.changed == 'true'
        run: uv run --with build python -m build

      - name: Publish to PyPI
        if: steps.version_check.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create signed release commit and tag
        if: steps.version_check.outputs.changed == 'true'
        id: signed_release
        uses: oWretch/create-verified-commits@d1bb1075043fd3e5ca12b7d106c051bf1951b208 # v1.1.1
        with:
          token: ${{ steps.release_token.outputs.token }}
          commit-message: ${{ steps.release_meta.outputs.commit_message }}
          tag-name: ${{ steps.release_meta.outputs.tag }}
          tag-message: Release ${{ steps.release_meta.outputs.tag }}
          fail-on-empty: false
          files: |
            pyproject.toml
            src/zencontrol_tpi_mcp/__init__.py
            uv.lock

      - name: Create GitHub Release (immutable, as draft)
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"

          # Check if release already exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # Create release as DRAFT with assets
            # This allows all assets to be attached before release becomes immutable
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --generate-notes \
              dist/*
            echo "Draft release created: $TAG"
          fi

      - name: Publish immutable release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"

          # Publish the draft release to make it immutable
          # (Only if not already published)
          if gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null | grep -q true; then
            gh release edit "$TAG" --draft=false --latest
            echo "Published immutable release: $TAG"
          else
            echo "Release $TAG already published"
          fi
