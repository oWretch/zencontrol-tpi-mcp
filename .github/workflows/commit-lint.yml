name: Commit Lint

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install conventional-pre-commit
        run: pip install conventional-pre-commit==4.4.0

      - name: Validate PR commit messages
        run: |
          git log --format="%H" "origin/${{ github.base_ref }}..HEAD" | \
          while IFS= read -r sha; do
            git log --format="%B" -n 1 "$sha" > /tmp/commit_msg
            conventional-pre-commit \
              --scopes api,tools,models,scope,resources,docs,chore,ci,deps,release,tests \
              build chore ci docs feat fix perf refactor revert style test \
              /tmp/commit_msg || {
                echo "❌ Invalid commit message in $sha:"
                git log --format="%s" -n 1 "$sha"
                exit 1
              }
          done
